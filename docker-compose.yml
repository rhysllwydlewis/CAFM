# Local services for development only. Start with: docker compose up -d
# Ports are bound to localhost. No passwords live in this file: Postgres trusts
# local connections, and MinIO reads MINIO_ROOT_PASSWORD from your .env
# (copy .env.example to .env and set it).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cafm
      POSTGRES_DB: cafm_dev
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
  redis:
    image: redis:7
    ports: ['127.0.0.1:6379:6379']
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    # The root password is passed through by name from your shell or .env.
    environment:
      - MINIO_ROOT_USER=cafm
      - MINIO_ROOT_PASSWORD
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
volumes:
  pgdata:
