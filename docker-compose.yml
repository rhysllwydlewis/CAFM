# Local services for development. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cafm
      POSTGRES_PASSWORD: cafm
      POSTGRES_DB: cafm_dev
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
  redis:
    image: redis:7
    ports: ['6379:6379']
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: cafm
      MINIO_ROOT_PASSWORD: cafm-minio-dev
    ports: ['9000:9000', '9001:9001']
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['1025:1025', '8025:8025']
volumes:
  pgdata:
