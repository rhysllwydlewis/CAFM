<!doctype html><html lang="en-GB" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set up two-step verification</title><link rel="stylesheet" href="../src/styles.css"></head><body><div style="min-height:100vh;display:grid;place-items:center;background:var(--bg-app)"><div class="card" style="width:520px;box-shadow:var(--shadow-md)"><div class="card-b" style="padding:28px;display:flex;flex-direction:column;gap:16px"><div><div style="font-family:var(--font-display);font-size:20px;font-weight:600">Set up two-step verification</div><div class="muted sm" style="margin-top:4px">Use an authenticator app such as Microsoft Authenticator, Google Authenticator or 1Password.</div></div><div class="row" style="gap:16px;align-items:flex-start"><div style="width:132px;height:132px;border:1px solid var(--border-control);border-radius:10px;display:grid;place-items:center;background:#fff"><svg class="i s24" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4" /><path d="M14 13.12c0 2.38 0 6.38-1 8.88" /><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02" /><path d="M2 12a10 10 0 0 1 18-6" /><path d="M2 16h.01" /><path d="M21.8 16c.2-2 .131-5.354 0-6" /><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2" /><path d="M8.65 22c.21-.66.45-1.32.57-2" /><path d="M9 6.8a6 6 0 0 1 9 5.2v2" /></svg></div><div class="stack g2 grow"><div class="sm">1. Scan the code with the app, or enter this key by hand.</div><div class="medium" style="font-family:var(--font-mono);letter-spacing:.08em">JBSW Y3DP EHPK 3PXP</div></div></div><div class="field"><span class="label">2. Enter the 6-digit code the app shows</span><div class="input  focus lg"><span class="grow" style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis">482 1</span></div></div><span class="btn primary  lg block "><span>Turn on two-step verification</span></span></div></div></div></body></html>
